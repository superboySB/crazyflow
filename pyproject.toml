[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crazyflow"
dynamic = ["version"]
description = "Bounding-box balloon contact with pure BPTT and Crazyflow dynamics."
authors = [{ name = "Martin Schuck" }, { name = "Marcel Rath" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17",
    "jax==0.12.0.1",
    "mujoco==4.0.0",
    "mujoco-mjx==4.0.0",
    # The official simulator uses Gymnasium's MuJoCo rendering helper.
    "gymnasium[mujoco]==1.4.0",
    "imageio",
    "imageio-ffmpeg",
    "einops",
    "flax==0.12.12",
    "optax>=0.2.9",
    "ml_collections",
    "casadi",
    "array-api-compat",
    "array-api-extra",
    # Official automatic identification imports matplotlib for optional fit plots.
    "matplotlib",
    "PyYAML==6.0.4",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.12.0.1"]
test = ["pytest", "pytest-timeout", "array-api-strict", "ruff"]

[project.urls]
Homepage = "https://github.com/learnsyslab/crazyflow"
Repository = "https://github.com/learnsyslab/crazyflow"

[tool.setuptools.packages]
find = { include = ["crazyflow*"] }

[tool.setuptools.dynamic]
version = { attr = "crazyflow.__version__" }

[tool.setuptools.data-files]
"share/crazyflow/assets" = ["assets/scene.xml"]
"share/crazyflow/assets/drones" = ["assets/drones/*.xml"]
"share/crazyflow/assets/drones/assets/cf2x" = ["assets/drones/assets/cf2x/*.stl"]
"share/crazyflow/assets/drones/assets/cf21B" = ["assets/drones/assets/cf21B/*.stl"]
"share/crazyflow/assets/drones/assets/hb_x500" = ["assets/drones/assets/hb_x500/*.stl"]
"share/crazyflow/config" = ["config/*.yaml", "config/*.json", "config/*.toml", "config/README.md"]
"share/crazyflow/config/dynamics" = ["config/dynamics/params.toml"]
"share/crazyflow/config/dynamics/first_principles" = ["config/dynamics/first_principles/params.toml"]
"share/crazyflow/config/dynamics/so_rpy" = ["config/dynamics/so_rpy/params.toml"]
"share/crazyflow/config/dynamics/so_rpy_rotor" = ["config/dynamics/so_rpy_rotor/params.toml"]
"share/crazyflow/config/dynamics/so_rpy_rotor_drag" = ["config/dynamics/so_rpy_rotor_drag/params.toml"]
"share/crazyflow/config/control/mellinger" = ["config/control/mellinger/params.toml"]
"share/crazyflow/docs" = ["docs/*.md", "docs/*.pdf"]
"share/crazyflow/docs/crazyflow_experiments_sysid" = ["docs/crazyflow_experiments_sysid/README.md", "docs/crazyflow_experiments_sysid/LICENSE", "docs/crazyflow_experiments_sysid/provenance.json"]
"share/crazyflow/examples/identification" = ["examples/identification/*.md", "examples/identification/*.csv", "examples/identification/*.json"]
"share/crazyflow/examples/balloon" = ["examples/balloon/*.md", "examples/balloon/*.npz", "examples/balloon/*.json", "examples/balloon/*.jsonl", "examples/balloon/*.png", "examples/balloon/*.gif"]

[tool.pytest.ini_options]
markers = ["unit", "integration", "render"]
addopts = "-m 'not render'"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "TCH", "ANN"]
ignore = ["ANN401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]  # Prevent ruff from reporting conflicting settings with isort
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]
# TODO: Remove once everything is stable and document
"crazyflow/*" = ["D100", "D101", "D102", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
